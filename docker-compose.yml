services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: analytics_timescaledb
    restart: always
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_password
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: analytics_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: analytics_db
      CLICKHOUSE_USER: analytics_user
      CLICKHOUSE_PASSWORD: analytics_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  rabbitmq:
    image: rabbitmq:3-management
    container_name: analytics_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: analytics_user
      RABBITMQ_DEFAULT_PASS: analytics_password

  minio:
    image: minio/minio:latest
    container_name: analytics_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: analytics_user
      MINIO_ROOT_PASSWORD: analytics_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  timescale_data:
  clickhouse_data:
  minio_data:
